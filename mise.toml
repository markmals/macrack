[tools]
node = "26"
pnpm = "12.15.0"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.install]
description = "Install the JavaScript dependencies"
run = "pnpm install"

[tasks.check]
description = "Format-check, lint and type-check TypeScript and Markdown"
run = "vp check"

[tasks.fmt]
description = "Format TypeScript and Markdown in place"
run = "vp fmt"

[tasks.test]
description = "Run the Vitest suites"
run = "vp test run"

[tasks.cad]
description = "Build and validate candidate CAD exports"
run = "node src/cli.ts build --config config/reference.toml"
